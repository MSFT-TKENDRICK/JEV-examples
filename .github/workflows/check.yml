name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Both operating systems, because Git for Windows checks out CRLF line
    # endings and the checks read files from the working tree.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Required, not incidental. scripts/media-check.ts compares the commit
          # date of a recording against the commit date of what it depicts, and
          # the default fetch-depth of 1 makes both unreachable. The check
          # refuses rather than passing in that case, so a shallow checkout here
          # fails the build loudly instead of silently approving every asset.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      # `check` runs typecheck first, then the suites and the docs link check.
      # The ordering is load-bearing: Node strips types without checking them,
      # so a suite can print a full set of passing counters while a type error
      # sits in the file it just executed.
      - run: npm run check

      # CI opts into fixtures explicitly; ordinary example commands call real Jev.
      - run: npm run all:mock
